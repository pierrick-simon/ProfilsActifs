name: Build and Publish Artifact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: profils-actifs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: profils-actifs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint source code
        run: npm run lint

      - name: Build full application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifact
          path: |
            profils-actifs/.next
            profils-actifs/public
          retention-days: 30
